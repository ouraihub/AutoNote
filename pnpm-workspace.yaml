packages:
  - web
  - desktop
  - packages/*

nodeLinker: hoisted
# Local Aether link dependencies must be materialized even with the hoisted linker.
symlink: true

minimumReleaseAge: 0
# Git workspace edges require this; deps:check restricts sources to pinned ouraihub tarballs.
blockExoticSubdeps: false
overrides:
  runed: 0.35.1
  '@ouraihub/aether-contracts': link:../Aether/packages/contracts
  '@ouraihub/aether-core': link:../Aether/packages/core
  '@ouraihub/aether-ui': link:../Aether/packages/ui
  '@ouraihub/aether-presets': link:../Aether/packages/presets

peerDependencyRules:
  allowAny:
    - '@ouraihub/aether-ui'

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  core-js-pure: false
  unrs-resolver: false

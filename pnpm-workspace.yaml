packages:
  - web
  - desktop
  - packages/*

nodeLinker: hoisted
symlink: false

minimumReleaseAge: 0
# Git workspace edges require this; deps:check restricts sources to pinned ouraihub tarballs.
blockExoticSubdeps: false

peerDependencyRules:
  allowAny:
    - '@ouraihub/aether-ui'

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  core-js-pure: false
  unrs-resolver: false
patchedDependencies:
  '@ouraihub/aether-ui@0.1.1': patches/@ouraihub__aether-ui@0.1.1.patch

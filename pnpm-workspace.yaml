packages:
  - web
  - desktop
  - packages/*

nodeLinker: hoisted
symlink: false

minimumReleaseAge: 0
# Aether Git subpackages use workspace:* internally; pin every replacement to the same commit.
# pnpm has no per-package exotic allowlist (root direct dependencies do not exempt Aether's inner
# workspace:* edges), so the block is off and `pnpm run deps:check` enforces the narrow policy instead:
# every non-registry lockfile resolution must be an ouraihub GitHub tarball pinned to a full SHA.
# Keep the lockfile and use frozen installs in CI/production.
blockExoticSubdeps: false
overrides:
  runed: 0.35.1
  '@ouraihub/aether-contracts': github:ouraihub/Aether#53b80630bdd58f22ca94d119e93586f84fbceec7&path:packages/contracts
  '@ouraihub/aether-core': github:ouraihub/Aether#53b80630bdd58f22ca94d119e93586f84fbceec7&path:packages/core

# presets' semver peer cannot recognize pnpm's fixed Git subpath version.
peerDependencyRules:
  allowAny:
    - '@ouraihub/aether-ui'

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  core-js-pure: false
  unrs-resolver: false

[package]
name = "note-ai"
description = "AutoNote AI model client: endpoint URLs, type inference, model probing, streaming chat. No Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
note-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "=1.53.1", features = ["time", "macros"] }
tokio-util = "=0.7.19"
futures-util = "=0.3.34"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util"] }

[lints]
workspace = true

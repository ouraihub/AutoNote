[package]
name = "note-sync"
description = "AutoNote sync client for the Web instance protocol. No Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
note-core.workspace = true
cookie = "=0.18.2"
url = "=2.5.8"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "=0.9.34"
sha2.workspace = true
tracing.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "=0.7.19"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
async-trait = "=0.1.89"
zeroize = "=1.8.2"

[lints]
workspace = true

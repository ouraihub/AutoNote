[workspace]
members = ["core", "sync", "mcp", "shell"]
resolver = "2"

[workspace.package]
version = "0.2.8"
edition = "2024"
license = "LGPL-3.0-only"
authors = ["AutoNote"]

[workspace.dependencies]
note-core = { path = "core" }
note-sync = { path = "sync" }
note-mcp = { path = "mcp" }
autonote-shell = { path = "shell" }
aether-observability = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
aether-providers = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
aether-chat = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
aether-mcp-server = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
aether-search = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
aether-skills = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
aether-mcp-client = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
tauri-plugin-aether = { git = "https://github.com/ouraihub/Aether.git", rev = "855c55bc2eb23c162323c9bfe29c2d9f8e430b9e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tempfile = "3"
sha2 = "0.10"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "autonote"
description = "AutoNote desktop shell (Tauri commands only)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "autonote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
note-core.workspace = true
autonote-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.1"
tokio = { version = "=1.53.1", features = ["time", "process", "io-util", "macros", "rt"] }
note-sync.workspace = true
note-mcp.workspace = true
aether-observability.workspace = true
aether-providers.workspace = true
aether-chat.workspace = true
aether-mcp-server.workspace = true
aether-search.workspace = true
aether-skills.workspace = true
aether-mcp-client.workspace = true
tauri-plugin-aether = { workspace = true, features = ["providers", "chat", "mcp-server", "search", "skills", "mcp-client"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
tokio-util = "0.7"
zeroize = "=1.8.2"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = "z"
strip = true
panic = "abort"

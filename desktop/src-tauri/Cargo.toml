[workspace]
members = ["core", "sync", "mcp", "shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
authors = ["AutoNote"]

[workspace.dependencies]
note-core = { path = "core" }
note-sync = { path = "sync" }
note-mcp = { path = "mcp" }
autonote-shell = { path = "shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "autonote"
description = "AutoNote desktop shell (Tauri commands only)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "autonote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
note-core.workspace = true
autonote-shell.workspace = true
serde.workspace = true
tracing.workspace = true
tauri = { version = "2.11.5", features = [] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

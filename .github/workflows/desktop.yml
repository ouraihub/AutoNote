name: Desktop

on:
  pull_request:
    paths:
      - desktop/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
      - .github/workflows/desktop-release.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
      - .github/workflows/desktop-release.yml
      - .release-please-manifest.json
  workflow_dispatch:

# Main runs queue instead of cancelling; GitHub keeps only one pending run per group, so a release
# merge pushed close to another commit can be superseded and must be re-run by hand.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
          - os: macos-14
            platform: macos
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux build, package and real desktop smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libsecret-1-dev gnome-keyring dbus-x11 xvfb xdotool openbox imagemagick
      - name: Require native Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Install the pinned Rust toolchain and target
        working-directory: desktop
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Explicit runner-only MSVC branch; local CI=true never selects system tools.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Enforce runner compiler ownership
        if: runner.os == 'Windows'
        shell: cmd
        run: call desktop\scripts\msvc-env.bat
      - run: pnpm install --frozen-lockfile
      - name: Full checks, native packages, secure store and packaged startup smoke
        run: pnpm run ci
      - name: Verify platform candidate manifest
        if: github.event_name != 'pull_request'
        run: node desktop/scripts/release-candidates.mjs verify desktop/dist/candidate-${{ matrix.platform }}/candidate.json
      - name: Upload verified platform candidates
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: candidate-${{ matrix.platform }}
          path: desktop/dist/candidate-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Tags only a merged release PR, and only after every native build passed; desktop-release.yml
  # then publishes these exact candidates.
  tag:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ouraihub/release-kit/tag@v0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

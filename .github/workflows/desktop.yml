name: Desktop

on:
  pull_request:
    paths:
      - desktop/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Puts the runner's preinstalled Visual Studio Build Tools (cl.exe, link.exe,
      # Windows SDK) on PATH. scripts\msvc-env.bat uses it only because GitHub sets
      # CI=true; local runs always use the portable MSVC instead.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Confirm the runner MSVC toolchain is active
        shell: cmd
        run: where cl.exe && where link.exe
      - run: pnpm install --frozen-lockfile
      - name: Verify gate
        run: pnpm run desktop:verify

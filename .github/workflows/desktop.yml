name: Desktop

on:
  pull_request:
    paths:
      - desktop/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Explicit runner-only MSVC branch; local CI=true never selects system tools.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call desktop\scripts\msvc-env.bat
      - run: pnpm install --frozen-lockfile
      - name: Verify gate
        run: pnpm run desktop:verify

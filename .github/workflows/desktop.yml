name: Desktop

on:
  # PRs always run: the three Build checks are required. The `scope` step below skips the heavy work
  # when a PR cannot change the desktop app, and still reports success.
  pull_request:
  # main only builds a release merge: desktop-release.yml publishes candidates from exactly that
  # commit, and every other main commit was already built as its PR.
  push:
    branches: [main]
    paths:
      - .release-please-manifest.json
  workflow_dispatch:

# Main runs queue instead of cancelling; GitHub keeps only one pending run per group, so a release
# merge pushed close to another commit can be superseded and must be re-run by hand.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI builds start from a cold incremental state: incremental bookkeeping and dev debuginfo only
  # grow target/ and the cache. Release profile is unaffected.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  verify:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
          - os: macos-14
            platform: macos
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Required checks must report, so PRs that cannot change the app skip work instead of the job:
      # release-please's own PR (version + CHANGELOG only; its merge push runs the full build before
      # tagging) and PRs touching nothing the desktop build reads.
      - name: Decide whether this PR needs a desktop build
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            release='^(\.release-please-manifest\.json|CHANGELOG\.md|desktop/package\.json|desktop/src-tauri/Cargo\.(toml|lock))$'
            desktop='^(desktop/|packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.github/workflows/desktop(-release)?\.yml$|\.release-please-manifest\.json$)'
            if [ "$SAME_REPO" = true ] && [[ "$HEAD_REF" == release-please--* ]] && ! grep -qvE "$release" <<<"$files"; then
              run=false; echo "release-please PR: version files only"
            elif ! grep -qE "$desktop" <<<"$files"; then
              run=false; echo "no desktop-relevant changes"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux build, package and real desktop smoke dependencies
        if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libsecret-1-dev gnome-keyring dbus-x11 xvfb xdotool openbox imagemagick
      - name: Require native Apple Silicon
        if: steps.scope.outputs.run == 'true' && runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Install the pinned Rust toolchain and target
        if: steps.scope.outputs.run == 'true'
        working-directory: desktop
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      # PRs restore main's cache but never write their own: saving costs ~2 min per job and the
      # branch caches are evicted unused.
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Explicit runner-only MSVC branch; local CI=true never selects system tools.
      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.scope.outputs.run == 'true' && runner.os == 'Windows'
        with:
          arch: x64
      - name: Enforce runner compiler ownership
        if: steps.scope.outputs.run == 'true' && runner.os == 'Windows'
        shell: cmd
        run: call desktop\scripts\msvc-env.bat
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.run == 'true'
      - name: Desktop checks, native packages, secure store and packaged startup smoke
        if: steps.scope.outputs.run == 'true'
        run: pnpm run ci:desktop
      - name: Verify platform candidate manifest
        if: github.event_name != 'pull_request'
        run: node desktop/scripts/release-candidates.mjs verify desktop/dist/candidate-${{ matrix.platform }}/candidate.json
      - name: Upload verified platform candidates
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: candidate-${{ matrix.platform }}
          path: desktop/dist/candidate-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Tags only a merged release PR, and only after every native build passed; desktop-release.yml
  # then publishes these exact candidates.
  tag:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ouraihub/release-kit/tag@v0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

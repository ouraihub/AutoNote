name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact desktop-v version; select this tag as the workflow ref too
        required: true
        type: string
      build_run_id:
        description: Successful Desktop run for the tag commit; blank selects the latest matching success
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check selected tag versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          pnpm --dir desktop exec desktop-kit version "$RELEASE_TAG"
      - name: Select successful Desktop run for the exact tag commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if [ -z "$BUILD_RUN_ID" ]; then
            BUILD_RUN_ID=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/desktop.yml/runs" -f head_sha="$(git rev-parse HEAD)" -f branch=main -f status=success -f per_page=100 --jq '.workflow_runs[0].id // empty')
          fi
          if ! [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful Desktop run for this commit. Complete Desktop first; release never rebuilds."
            exit 1
          fi
          echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          name: candidate-windows
          path: desktop/dist/candidates/candidate-windows
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-macos
          path: desktop/dist/candidates/candidate-macos
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-linux
          path: desktop/dist/candidates/candidate-linux
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, successful native jobs and five package hashes; publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          pnpm exec release-kit notes "${RELEASE_TAG#desktop-v}" > "$RUNNER_TEMP/changes.md"
          pnpm --dir desktop exec desktop-kit publish "$RELEASE_TAG" --changes "$RUNNER_TEMP/changes.md" --run "$BUILD_RUN_ID"

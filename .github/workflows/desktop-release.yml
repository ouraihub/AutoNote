name: Desktop release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Runner's preinstalled VS Build Tools. scripts\msvc-env.bat accepts it only
      # because CI=true; local builds always use the portable MSVC.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Confirm the runner MSVC toolchain is active
        shell: cmd
        run: where cl.exe && where link.exe
      - run: pnpm install --frozen-lockfile
      - name: Tag must match the app version
        shell: bash
        run: |
          app_version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          test "${GITHUB_REF_NAME}" = "desktop-v${app_version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match desktop version ${app_version}"
            exit 1
          }
      - name: Build (verify gate, NSIS installer, portable zip)
        working-directory: desktop
        shell: cmd
        run: scripts\build-app.bat
      - name: Smoke test the packaged exe
        working-directory: desktop
        run: node scripts/smoke-app.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "AutoNote Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --generate-notes \
            desktop/dist/installer/*

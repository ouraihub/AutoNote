name: Web

on:
  # No path filter on PRs: Web checks are required for every merge, and a filtered-out workflow
  # would leave them pending forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - web/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .node-version
      - .github/workflows/web.yml
  # Deploys run only when started by hand (Actions → Web → Run workflow, tick
  # "deploy"). To deploy on every push to main again, change the deploy job's
  # `if` to: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare after checks pass
        type: boolean
        default: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Web check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run web:check
      - run: pnpm run web:test
      - run: pnpm run web:build

  e2e:
    name: Web e2e
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start an isolated local instance
        working-directory: web
        env:
          AUTONOTE_EPHEMERAL_DEV: '1'
        run: |
          pnpm exec vite --port 7712 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://localhost:7712/api/health >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1
      - name: API end-to-end suite
        working-directory: web
        run: node scripts/e2e.mjs http://localhost:7712

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

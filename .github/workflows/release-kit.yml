name: Release PR

on:
  push:
    branches: [main]
  pull_request:
  # Daily release (03:00 Beijing): every merge between two releases ships in one desktop build.
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No path filter: docs-only pushes skip web.yml/desktop.yml but their commits still get checked.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Commit rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ouraihub/release-kit/check@v0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Review input boundary regression
        run: node .github/scripts/ai-review.mjs --self-test

  release-pr:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # RELEASE_TOKEN, not GITHUB_TOKEN: a PR opened by GITHUB_TOKEN triggers no workflows, so the
      # release PR would get neither CI nor AI review and could never merge itself.
      - uses: ouraihub/release-kit@v0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # Enables auto-merge on the open release PR; branch protection still waits for every required
  # check, including AI review. No open release PR (nothing to release) is a no-op.
  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge the release PR once its checks pass
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          pr=$(gh pr list -R ${{ github.repository }} --state open --json number,headRefName \
            -q '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')
          if [ -z "$pr" ]; then echo "nothing to release"; exit 0; fi
          gh pr merge "$pr" -R ${{ github.repository }} --auto --merge
